<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>
    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JS/Common.js"></script>
    <script src="../JS/ManageStudent.js"></script>
</head>
<body class="admin">
    <img src="../Images/logo.png" id="logo" alt="Project Logo">
    <div class="header"><h1>Manage Students</h1><p>Search, update and delete student records</p></div>
    <div class="topnav">
        <a href="../index.html">Dashboard</a>
        <a href="AddStudent.html">Add Student</a>
        <a href="ManageStudent.html" class="active">Manage Students</a>
        <a href="Attendance.html">Attendance</a>
        <a href="Results.html">Results</a>
    </div>

    <fieldset>
        <legend>Search Student</legend>
        <div class="search-row">
            <input type="search" id="studentSearch" placeholder="Search by name, ID, email or department">
            <select id="departmentFilter"><option value="">All Departments</option></select>
            <button type="button" class="action-button" onclick="clearStudentSearch()">Clear</button>
        </div>
        <p class="hint" id="studentCount">0 student(s) found</p>
    </fieldset>

    <fieldset>
        <legend>Student Records</legend>
        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>Name</th><th>Student ID</th><th>Department</th><th>Semester</th><th>Phone</th><th>Actions</th></tr></thead>
                <tbody id="studentTableBody"><tr><td colspan="6">No student records available.</td></tr></tbody>
            </table>
        </div>
    </fieldset>
    <p id="ResultText"></p>
    <div class="footer"><h5>Student Management System - Admin Panel</h5></div>
</body>
</html>
