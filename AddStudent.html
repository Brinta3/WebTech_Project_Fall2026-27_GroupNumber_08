<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JS/Common.js"></script>
    <script src="../JS/AddStudent.js"></script>
</head>
<body class="admin">
    <img src="../Images/logo.png" id="logo" alt="Project Logo">
    <div class="header"><h1>Add Student Form</h1><p>Enter student information carefully</p></div>
    <div class="topnav">
        <a href="../index.html">Dashboard</a>
        <a href="AddStudent.html" class="active">Add Student</a>
        <a href="ManageStudent.html">Manage Students</a>
        <a href="Attendance.html">Attendance</a>
        <a href="Results.html">Results</a>
    </div>

    <form id="studentForm" onsubmit="return saveStudentForm()" onreset="clearAllErrors()" novalidate>
        <input type="hidden" id="EditIndex" value="">
        <fieldset>
            <legend>Personal Information</legend>
            <table>
                <tr><td><label for="StudentName">Full Name:</label></td><td><input type="text" id="StudentName" placeholder="Enter full name"><p class="error" id="NameError"></p></td></tr>
                <tr><td><label for="StudentID">Student ID:</label></td><td><input type="text" id="StudentID" placeholder="e.g. STU-1001"><p class="hint">Format: STU- followed by 4 digits</p><p class="error" id="StudentIDError"></p></td></tr>
                <tr><td><label for="StudentEmail">Email:</label></td><td><input type="email" id="StudentEmail" placeholder="student@example.com"><p class="error" id="EmailError"></p></td></tr>
                <tr><td><label for="StudentPhone">Phone:</label></td><td><input type="tel" id="StudentPhone" placeholder="e.g. 01712345678"><p class="error" id="PhoneError"></p></td></tr>
                <tr><td><label>Gender:</label></td><td>
                    <label class="choice"><input type="radio" name="gender" value="Male"> Male</label>
                    <label class="choice"><input type="radio" name="gender" value="Female"> Female</label>
                    <label class="choice"><input type="radio" name="gender" value="Other"> Other</label>
                    <p class="error" id="GenderError"></p>
                </td></tr>
                <tr><td><label for="DateOfBirth">Date of Birth:</label></td><td><input type="date" id="DateOfBirth"><p class="error" id="DOBError"></p></td></tr>
                <tr><td><label for="Address">Address:</label></td><td><textarea id="Address" placeholder="Enter student address"></textarea><p class="error" id="AddressError"></p></td></tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Academic Information</legend>
            <table>
                <tr><td><label for="Department">Department:</label></td><td>
                    <select id="Department"><option value="">-- Select Department --</option><option value="CSE">CSE</option><option value="EEE">EEE</option><option value="BBA">BBA</option><option value="English">English</option><option value="Architecture">Architecture</option><option value="Other">Other</option></select>
                    <p class="error" id="DepartmentError"></p>
                </td></tr>
                <tr><td><label for="Semester">Current Semester:</label></td><td>
                    <select id="Semester"><option value="">-- Select Semester --</option><option>1st Semester</option><option>2nd Semester</option><option>3rd Semester</option><option>4th Semester</option><option>5th Semester</option><option>6th Semester</option><option>7th Semester</option><option>8th Semester</option><option>9th Semester</option><option>10th Semester</option><option>11th Semester</option><option>12th Semester</option></select>
                    <p class="error" id="SemesterError"></p>
                </td></tr>
                <tr><td><label for="AdmissionYear">Admission Year:</label></td><td><input type="number" id="AdmissionYear" placeholder="e.g. 2024"><p class="error" id="AdmissionYearError"></p></td></tr>
            </table>
        </fieldset>

        <p id="ResultText"></p>
        <input type="submit" id="submit" value="Save Student">
        <input type="reset" id="reset" value="Reset">
    </form>
    <div class="footer"><h5>Student Management System - Admin Panel</h5></div>
</body>
</html>
